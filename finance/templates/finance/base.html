<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>{% block title %}{% endblock title %}</title>
</head>
<body class="bg-gray-100">
    <nav class="bg-indigo-500 p-4 text-white">
        {% if user.is_authenticated %}  
        <a href="{%url 'transaction_add' %}" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded mr-2">Add Transaction</a>
        <a href="{% url 'dashboard' %}" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded mr-2">Dashboard</a>
        <a href="{% url 'transaction_list' %}" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded mr-2">View Transactions</a>
        <a href="{% url 'goal_add' %}" class="bg-purple-500 hover:bg-purple-600 text-white px-3 py-1 rounded mr-2">Add Goal</a>
        <form id="logout-form" method="post" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <a href="#" onclick="document.getElementById('logout-form').submit();" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded mr-2">Logout</a>
        </form>
        {% else %}
        <a href="{% url 'login' %}" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded mr-2">Login</a>
        <a href="{% url 'register' %}" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded">Register</a>
        {% endif %}
    </nav>          
        
    {% block content %}{% endblock content %}

</body>
</html>
